<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Password Reset</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; color: #333; margin: 0; padding: 0; }
        .login-container { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { display: block; width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 20px; box-sizing: border-box; text-decoration: none; text-align: center; }
        .btn:hover { background-color: #2980b9; }
        .back-link { display: block; margin-top: 20px; color: #3498db; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>Reset Password</h2>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="user@university.edu">
            </div>
            <a href="#" class="btn">Send Reset Link</a>
            <a href="index.html" class="back-link">Back to Login</a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - User Management</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; color: #333; margin: 0; padding: 0; }
        .dashboard-container { display: flex; }
        .sidebar { width: 250px; background-color: #2c3e50; color: white; padding: 20px 0; position: fixed; height: 100vh; overflow-y: auto; }
        .sidebar h2 { text-align: center; margin-bottom: 30px; }
        .sidebar ul { list-style-type: none; padding: 0; margin: 0; }
        .sidebar ul li a { display: block; padding: 15px 20px; color: white; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar ul li a:hover { background-color: rgba(0,0,0,0.1); }
        .sidebar ul li a.active { background-color: rgba(0,0,0,0.2); border-left: 4px solid #fff; }
        .logout-btn { display: block; margin: 30px 20px; padding: 10px; background-color: rgba(255,255,255,0.2); text-align: center; border-radius: 4px; color: white; text-decoration: none; }
        .main-content { margin-left: 250px; padding: 30px; flex: 1; }
        .section { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .section h3 { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; }
        .simple-form { max-width: 400px; margin-bottom: 30px; }
        .simple-form input, .simple-form select { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .simple-form button, .btn { padding: 8px 15px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <h2>Admin Panel</h2>
            <ul>
                <li><a href="admin_users.html" class="active">User Management</a></li>
                <li><a href="admin_departments.html">Departments & Programs</a></li>
                <li><a href="admin_programs.html">Degree Programs</a></li>
                <li><a href="admin_courses.html">Course Catalog</a></li>
                <li><a href="admin_classrooms.html">Classroom Resources</a></li>
                <li><a href="admin_scheduling.html">Class Scheduling</a></li>
                <li><a href="admin_reports.html">System Reports</a></li>
            </ul>
            <a href="index.html" class="logout-btn">Logout</a>
        </div>
        <div class="main-content">
            <div class="section">
                <h3>User Management</h3>
                <div class="simple-form">
                    <h4>Add New User</h4>
                    <form>
                        <input type="text" placeholder="Full Name">
                        <input type="email" placeholder="Email Address">
                        <select>
                            <option>Admin</option>
                            <option>Faculty</option>
                            <option>Student</option>
                        </select>
                        <button type="button">Add User</button>
                    </form>
                </div>
                <h4>Existing Users</h4>
                <table>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Action</th>
                    </tr>
                    <tr>
                        <td>Tabasum Aktar</td>
                        <td>jane@univ.edu</td>
                        <td>Faculty</td>
                        <td><a href="#">Edit</a></td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
